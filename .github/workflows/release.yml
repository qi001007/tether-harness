name: Draft release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build from main, for example v0.2.1
        required: true
        type: string
permissions:
  contents: write

jobs:
  build-and-draft:
    runs-on: windows-latest
    steps:
      - name: Check out the requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate release source and tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF_TYPE -ne 'branch' -or $env:GITHUB_REF_NAME -ne 'main') {
              throw 'Manual baseline releases must run from the main branch.'
            }
            $tag = $env:INPUT_TAG
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
          $tagRef = "refs/tags/$tag"
          $tagExists = $false
          $tagCommit = $null
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -eq 0) {
            $tagExists = $true
            $tagCommit = (git rev-parse "$tagRef^{commit}").Trim()
            if ($LASTEXITCODE -ne 0) { throw "Tag does not resolve to a commit: $tag" }
            if ($tagCommit -ne $env:GITHUB_SHA) { throw "Tag $tag points to $tagCommit, not this workflow commit $env:GITHUB_SHA" }
          } elseif ($LASTEXITCODE -ne 1) {
            throw "Could not check tag: $tag"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and -not $tagExists) { throw "Pushed tag is missing from checkout: $tag" }
          $version = Get-Content -Raw version.json | ConvertFrom-Json
          $components = @($version.components.app, $version.components.plugin, $version.components.node) | Select-Object -Unique
          $releaseVersion = [string]$version.components.app
          if ($components.Count -ne 1 -or ("v" + $releaseVersion) -ne $tag) { throw "Tag $tag does not match component versions in version.json" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CREATE_TAG=$(-not $tagExists)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0
      - name: Install Python project and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e . pytest pytest-asyncio httpx; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install shared UI dependencies
        shell: pwsh
        run: npm ci --prefix packages/tether-ui
      - name: Build shared plugin and web UI
        shell: pwsh
        run: |
          npm --prefix packages/tether-ui run build; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/tether-ui run build:web; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Python and JavaScript regressions
        shell: pwsh
        run: |
          python -m pytest -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test_*.mjs; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify standalone archives
        shell: pwsh
        run: |
          python scripts/build_release.py; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content -Raw version.json | ConvertFrom-Json).components.app
          $expected = @("tether-app-$version.zip", "tether-plugin-$version.zip", "tether-node-$version.zip", 'tether-update.json')
          foreach ($name in $expected) { if (-not (Test-Path (Join-Path release $name))) { throw "Release asset missing: $name" } }

      - name: Create or refresh a draft release and upload artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const tag = process.env.RELEASE_TAG
            if (process.env.CREATE_TAG === 'True') {
              try {
                await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo,
                  ref: `refs/tags/${tag}`, sha: context.sha })
                core.info(`Created ${tag} at ${context.sha} after all build checks passed.`)
              } catch (error) {
                if (error.status !== 422) throw error
                const existing = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo,
                  ref: `tags/${tag}` })
                if (existing.data.object.sha !== context.sha) throw new Error(`Tag ${tag} was concurrently created at a different commit.`)
              }
            }
            const names = ['tether-app', 'tether-plugin', 'tether-node'].map(name => `${name}-${tag.slice(1)}.zip`).concat('tether-update.json')
            const { owner, repo } = context.repo
            let release
            try {
              const current = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              if (!current.data.draft) throw new Error(`Release ${tag} is already published; refusing to replace it.`)
              if (current.data.tag_name !== tag) throw new Error(`Release tag mismatch for ${tag}.`)
              release = current.data; await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, name: tag, draft: true })
            } catch (error) {
              if (error.status !== 404) throw error
              const created = await github.rest.repos.createRelease({ owner, repo, tag_name: tag, name: tag, draft: true, prerelease: false, body: 'Build passed. Review artifacts and notes before publishing.' })
              release = created.data
            }
            for (const asset of release.assets) if (names.includes(asset.name)) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id })
            for (const name of names) {
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data: fs.readFileSync(path.join('release', name)) })
            }
            core.info(`Draft ${tag} is ready for review. It was not published.`)
