          pattern: 'tether-*-${{ steps.source-version.outputs.release_version }}-preview'
          path: .release-inputs
      - name: Download Windows package from current recovery run
        if: ${{ contains(github.event.head_commit.message, '[windows-recovery]') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-windows-x64-${{ steps.source-version.outputs.release_version }}-preview
          path: .release-inputs/tether-windows-x64-${{ steps.source-version.outputs.release_version }}-preview
      - name: Download Windows package from verified source run
        if: ${{ contains(github.event.head_commit.message, '[preview-publish-only]') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-windows-x64-0.5.0-preview
          path: .release-inputs/tether-windows-x64-0.5.0-preview
          github-token: ${{ github.token }}
          repository: qi001007/tether-harness
          run-id: 42523512038
      - name: Download Linux package from verified source run
        if: ${{ contains(github.event.head_commit.message, '[windows-recovery]') || contains(github.event.head_commit.message, '[preview-publish-only]') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-linux-x64-0.5.0-preview
          path: .release-inputs/tether-linux-x64-0.5.0-preview
          github-token: ${{ github.token }}
          repository: qi001007/tether-harness
