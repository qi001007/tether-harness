      - name: Download Linux Node runtime from verified source run
        if: ${{ contains(github.event.head_commit.message, '[windows-recovery]') || contains(github.event.head_commit.message, '[preview-publish-only]') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-node-runtime-linux-x64-0.5.0-preview
          path: .release-inputs/tether-node-runtime-linux-x64-0.5.0-preview
          github-token: ${{ github.token }}
          repository: qi001007/tether-harness
          run-id: 42520196405
      - name: Fetch the fixed original DSH plugin release metadata and archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-frozen-plugin
          base='https://github.com/qi001007/tether-harness/releases/download/v0.2.93'
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            "$base/tether-update.json" -o .release-frozen-plugin/tether-update.json
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            "$base/tether-plugin-0.2.93.zip" -o .release-frozen-plugin/tether-plugin-0.2.93.zip
          echo '08f33b371de45895316a3e132f40c11976ed30cdd2fceebc38bcab2608c1f9df  .release-frozen-plugin/tether-plugin-0.2.93.zip' | sha256sum --check
      - name: Create signed preview manifest and source archives
        env:
          TETHER_RELEASE_PRIVATE_KEY: ${{ secrets.TETHER_RELEASE_PRIVATE_KEY }}
          TETHER_REQUIRE_SIGNED_RELEASE: '1'
        run: |
          python scripts/build_release.py \
            --channel preview \
            --release-tag "v${TETHER_RELEASE_VERSION}-preview.1" \
            --frozen-plugin-manifest .release-frozen-plugin/tether-update.json \
            --frozen-plugin-archive .release-frozen-plugin/tether-plugin-0.2.93.zip \
            --node-deb ".release-inputs/tether-node-runtime-linux-x64-${TETHER_RELEASE_VERSION}-preview/Tether-node-runtime-${TETHER_RELEASE_VERSION}-linux-x64.deb" \
            --output-dir .release-manifest
      - name: Assemble unique draft release assets
        shell: bash
        env:
          WINDOWS_RECOVERY: ${{ contains(github.event.head_commit.message, '[windows-recovery]') }}
          PUBLISH_ONLY: ${{ contains(github.event.head_commit.message, '[preview-publish-only]') }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path
          import yaml

          inputs = Path('.release-inputs')
          release_version = os.environ['TETHER_RELEASE_VERSION']
          expected = {
              f'tether-windows-x64-{release_version}-preview', f'tether-linux-x64-{release_version}-preview',
              f'tether-macos-x64-{release_version}-preview', f'tether-macos-arm64-{release_version}-preview',
              f'tether-node-runtime-linux-x64-{release_version}-preview',
          }
          artifacts = {path.name: path for path in inputs.iterdir() if path.is_dir()}
          if not expected.issubset(artifacts):
              raise SystemExit('missing candidate artifacts: ' + ', '.join(sorted(expected - artifacts.keys())))
          output = Path('release-assets')
          output.mkdir()

          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(block)
              return value.hexdigest()

          def add_file(source, expected_sha=None, expected_size=None, target_name=None):
              target_name = target_name or source.name
              if Path(target_name).name != target_name or '\\' in target_name or target_name in {'.', '..'}:
                  raise SystemExit('unsafe release filename: ' + target_name)
              if not source.is_file():
                  raise SystemExit('listed release asset is missing: ' + str(source))
              current = digest(source)
              if expected_sha and current.lower() != expected_sha.lower():
                  raise SystemExit('release asset digest mismatch: ' + source.name)
              if expected_size is not None and source.stat().st_size != expected_size:
                  raise SystemExit('release asset size mismatch: ' + source.name)
              target = output / target_name
              if target.exists():
                  if digest(target) != current:
                      raise SystemExit('release asset name collision: ' + source.name)
                  return
              shutil.copy2(source, target)

          for artifact_name in sorted(expected - {f'tether-node-runtime-linux-x64-{release_version}-preview'}):
              artifact_dir = artifacts[artifact_name]
              checksum_file = artifact_dir / 'SHA256SUMS.json'
              if not checksum_file.is_file():
                  raise SystemExit('candidate package has no SHA256SUMS.json: ' + artifact_name)
              checksum = json.loads(checksum_file.read_text(encoding='utf-8'))
              if checksum.get('version') != release_version:
                  raise SystemExit('candidate checksum manifest has a mismatched version: ' + artifact_name)
              normalized_artifacts = []
              for item in checksum.get('artifacts', []):
                  name = item.get('name')
                  if not isinstance(name, str) or Path(name).name != name:
                      raise SystemExit('unsafe filename in candidate checksum manifest')
                  if name in {'builder-debug.yml', 'builder-effective-config.yaml'}:
                      continue
                  target_name = name
                  if name == 'preview-mac.yml':
                      if artifact_name not in {f'tether-macos-x64-{release_version}-preview', f'tether-macos-arm64-{release_version}-preview'}:
                          raise SystemExit('unexpected preview-mac.yml outside a macOS artifact')
                      architecture = 'x64' if artifact_name == f'tether-macos-x64-{release_version}-preview' else 'arm64'
                      target_name = f'preview-mac-{architecture}.yml'
                  add_file(artifact_dir / name, item.get('sha256'), item.get('size'), target_name)
                  normalized_artifacts.append({**item, 'name': target_name})
              checksum['artifacts'] = normalized_artifacts
              (output / (artifact_name + '.SHA256SUMS.json')).write_text(
                  json.dumps(checksum, indent=2) + '\n', encoding='utf-8')

          mac_manifests = []
          for architecture in ('x64', 'arm64'):
              path = output / f'preview-mac-{architecture}.yml'
              if not path.is_file():
                  raise SystemExit('macOS candidate metadata missing: ' + path.name)
              info = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(info, dict) or info.get('version') != release_version or not isinstance(info.get('files'), list):
                  raise SystemExit('invalid electron-updater metadata: ' + path.name)
              expected_arch_token = f'mac-{architecture}'
              matching_zips = [item for item in info['files'] if isinstance(item, dict)
                               and isinstance(item.get('url'), str)
                               and item['url'].lower().endswith('.zip')
                               and expected_arch_token in item['url'].lower()]
              if not matching_zips or any(not item.get('sha512') or not isinstance(item.get('size'), int)
                                          for item in matching_zips):
                  raise SystemExit('macOS metadata lacks the architecture-specific updater zip: ' + path.name)
              mac_manifests.append(info)
          if mac_manifests[0]['version'] != mac_manifests[1]['version']:
              raise SystemExit('macOS update metadata versions differ')
          merged = dict(mac_manifests[0])
          merged.pop('path', None)
          merged.pop('sha512', None)
          merged.pop('sha2', None)
          files_by_url = {}
          for info in mac_manifests:
              for item in info['files']:
                  if not isinstance(item, dict) or not isinstance(item.get('url'), str):
                      raise SystemExit('invalid file entry in macOS update metadata')
                  previous = files_by_url.get(item['url'])
                  if previous is not None and previous != item:
                      raise SystemExit('conflicting macOS update metadata for ' + item['url'])
                  files_by_url[item['url']] = item
          merged['files'] = [files_by_url[url] for url in sorted(files_by_url)]
          dates = [str(info['releaseDate']) for info in mac_manifests if info.get('releaseDate') is not None]
          if dates:
              merged['releaseDate'] = max(dates)
          (output / 'preview-mac.yml').write_text(yaml.safe_dump(merged, sort_keys=False), encoding='utf-8')
          # Per-architecture checksum manifests reference these files; keep them beside the canonical merged updater manifest.

          headless = artifacts[f'tether-node-runtime-linux-x64-{release_version}-preview']
          headless_manifest = json.loads((headless / f'Tether-node-runtime-{release_version}-linux-x64.deb.manifest-fragment.json').read_text(encoding='utf-8'))
          if headless_manifest.get('version') != release_version:
              raise SystemExit('headless Node package metadata has a mismatched version')
          headless_names = {
              f'Tether-node-runtime-{release_version}-linux-x64.tar.gz',
              f'Tether-node-runtime-{release_version}-linux-x64.tar.gz.sha256',
              f'Tether-node-runtime-{release_version}-linux-x64.deb',
              f'Tether-node-runtime-{release_version}-linux-x64.deb.sha256',
              f'Tether-node-runtime-{release_version}-linux-x64.deb.manifest-fragment.json',
          }
          for name in sorted(headless_names):
              add_file(headless / name)

          manifest_dir = Path('.release-manifest')
          builder_names = {'tether-update.json', f'tether-app-{release_version}.zip', f'tether-node-{release_version}.zip',
                           f'Tether-node-runtime-{release_version}-linux-x64.deb'}
          for name in sorted(builder_names):
              add_file(manifest_dir / name)
          required = {f'Tether-{release_version}-win-x64.exe', f'Tether-node-runtime-{release_version}-linux-x64.tar.gz',
                      f'Tether-node-runtime-{release_version}-linux-x64.deb', 'tether-update.json', 'preview-mac.yml'}
          recovery = os.environ['WINDOWS_RECOVERY'].lower() == 'true'
          publish_only = os.environ['PUBLISH_ONLY'].lower() == 'true'
          current_source = {'run_id': int(os.environ['SOURCE_RUN_ID']),
                            'head_sha': os.environ['SOURCE_SHA']}
          reused_source = {'run_id': 42520196405,
                           'head_sha': '97aa80f20f32c25ed9ad3ad99078d28d8e07924c'}
          reused_windows_source = {'run_id': 42523512038,
                                   'head_sha': '898976b2319261012df8b4da77fa643b9e2f6360'}
          artifact_sources = {name: current_source for name in sorted(expected)}
          if recovery or publish_only:
              for name in {
                      f'tether-linux-x64-{release_version}-preview',
                      f'tether-macos-x64-{release_version}-preview',
                      f'tether-macos-arm64-{release_version}-preview',
                      f'tether-node-runtime-linux-x64-{release_version}-preview'}:
                  artifact_sources[name] = reused_source
          if publish_only:
              artifact_sources[f'tether-windows-x64-{release_version}-preview'] = reused_windows_source
          (output / 'package-build-provenance.json').write_text(json.dumps({
              'repository': os.environ['SOURCE_REPOSITORY'],
              'current_source_sha': os.environ['SOURCE_SHA'],
              'current_run_id': int(os.environ['SOURCE_RUN_ID']),
              'publisher_source': {'run_id': int(os.environ['SOURCE_RUN_ID']),
                                   'head_sha': os.environ['SOURCE_SHA']},
              'mode': 'preview-publish-only' if publish_only else 'windows-recovery' if recovery else 'same-run',
              'artifacts': artifact_sources,
          }, indent=2) + '\n', encoding='utf-8')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('| Artifact | Source run | Source commit |\n| --- | ---: | --- |\n')
              for name, source in sorted(artifact_sources.items()):
                  summary.write(f"| {name} | {source['run_id']} | `{source['head_sha']}` |\n")
          required.add('package-build-provenance.json')
          missing = required - {path.name for path in output.iterdir() if path.is_file()}
          if missing:
              raise SystemExit('missing required release files: ' + ', '.join(sorted(missing)))
          print('Prepared', len(list(output.iterdir())), 'whitelisted candidate release assets.')
          PY
      - name: Create or refresh the draft preview release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.source-version.outputs.release_version }}-preview.1
          target_commitish: ${{ github.sha }}
          name: Tether ${{ steps.source-version.outputs.release_version }} Preview 1
          body: 'Preview candidate assembled from per-platform CI artifacts. See package-build-provenance.json for each artifact source run and commit. This draft is not a stable release.'
          draft: true
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
