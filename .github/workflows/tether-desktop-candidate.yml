name: Tether desktop preview candidate

on:
  push:
    branches: ['codex/tether-050-preview-20261108']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ (contains(github.event.head_commit.message, '[windows-recovery]') || contains(github.event.head_commit.message, '[preview-publish-only]')) && format('tether-desktop-preview-windows-recovery-{0}', github.ref) || format('tether-desktop-preview-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build-codeg-web:
    name: Build pinned Codeg web runtime
    if: ${{ !contains(github.event.head_commit.message, '[preview-publish-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spacering-net/codeg
          ref: e3171d69d208bdf37697b15e8b14f8c9b70825bf
          path: .runtime/codeg-source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Install the pinned Codeg dependencies
        working-directory: .runtime/codeg-source
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack pnpm install --frozen-lockfile
      - name: Build the Codeg static runtime from source
        shell: pwsh
        env:
          CODEG_GALLERY: '0'
          NEXT_TELEMETRY_DISABLED: '1'
        run: ./scripts/build_codeg_runtime.ps1 -ExportDirectory .runtime/codeg-built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tether-pinned-codeg-web
          path: .runtime/codeg-built/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
  hydrate-herdr-runtime:
    name: Hydrate pinned Herdr runtime once
    permissions:
      contents: write
    if: ${{ !contains(github.event.head_commit.message, '[preview-publish-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Download and verify the signed Node runtime source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tether-node-0.5.1.zip"
          gh api repos/qi001007/tether-harness/releases/assets/726040037 \
            -H 'Accept: application/octet-stream' > "$archive"
          echo '5a8ea437d9506023e0496da4e5bafd9b5c3a6ec7f7f9b72a969afde364ee398e  '"$archive" | sha256sum --check
          python scripts/hydrate_herdr_runtime.py \
            --destination .runtime/herdr-runtime \
            --seed-archive "$archive" \
            --seed-prefix tether-node-0.5.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tether-pinned-herdr-runtime
          path: .runtime/herdr-runtime/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  package:
    name: ${{ matrix.target }}
    if: ${{ !contains(github.event.head_commit.message, '[preview-publish-only]') }}
    needs: [build-codeg-web, hydrate-herdr-runtime]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.event.head_commit.message, '[windows-recovery]') && '[{"target":"windows-x64","runner":"windows-latest","platform":"windows","arch":"x64"}]' || contains(github.event.head_commit.message, '[posix-only]') && '[{"target":"linux-x64","runner":"ubuntu-22.04","platform":"linux","arch":"x64"},{"target":"macos-x64","runner":"macos-15-intel","platform":"macos","arch":"x64"},{"target":"macos-arm64","runner":"macos-15","platform":"macos","arch":"arm64"}]' || '[{"target":"windows-x64","runner":"windows-latest","platform":"windows","arch":"x64"},{"target":"linux-x64","runner":"ubuntu-22.04","platform":"linux","arch":"x64"},{"target":"macos-x64","runner":"macos-15-intel","platform":"macos","arch":"x64"},{"target":"macos-arm64","runner":"macos-15","platform":"macos","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'macos-x64' && 65 || 35 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: |
            apps/tether-app/package-lock.json
            packages/tether-ui/package-lock.json
            desktop/packaging/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Validate candidate version and frozen plugin channel
        id: source-version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content -Raw version.json | ConvertFrom-Json
          $app = Get-Content -Raw apps/tether-app/package.json | ConvertFrom-Json
          $lock = Get-Content -Raw apps/tether-app/package-lock.json | ConvertFrom-Json -AsHashtable
          $candidateVersion = [string]$release.components.app
          if ($candidateVersion -notmatch '^\d+\.\d+\.\d+$' -or $release.components.node -ne $candidateVersion -or $app.version -ne $candidateVersion -or $lock['version'] -ne $candidateVersion -or $lock['packages'][''].version -ne $candidateVersion) { throw 'APP, Node, and APP lockfile versions must match version.json.' }
          if ($release.components.plugin -ne '0.2.93') { throw 'The candidate must retain the frozen DSH plugin version 0.2.93.' }
          "TETHER_RELEASE_VERSION=$candidateVersion" >> $env:GITHUB_ENV
          "release_version=$candidateVersion" >> $env:GITHUB_OUTPUT
      - name: Install pinned desktop packaging tools
        run: npm ci --prefix desktop/packaging
      - name: Install APP production dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --prefix apps/tether-app
      - name: Download Electron release asset and seed the verified electron-get cache
        env:
          GH_TOKEN: ${{ github.token }}
          ELECTRON_ASSET_ID: ${{ matrix.target == 'windows-x64' && '249672704' || matrix.target == 'linux-x64' && '249666501' || matrix.target == 'macos-x64' && '249674370' || '249673532' }}
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.target }}' in
            windows-x64) platform=win32; arch=x64 ;;
            linux-x64) platform=linux; arch=x64 ;;
            macos-x64) platform=darwin; arch=x64 ;;
            macos-arm64) platform=darwin; arch=arm64 ;;
            *) echo 'Unsupported Electron target' >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/electron-v33.4.11-$platform-$arch.zip"
          gh api "repos/electron/electron/releases/assets/$ELECTRON_ASSET_ID" \
            -H 'Accept: application/octet-stream' > "$archive"
          ELECTRON_ARCHIVE="$archive" ELECTRON_PLATFORM="$platform" ELECTRON_ARCH="$arch" node - <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const path = require('node:path')
          const electronDir = path.resolve('apps/tether-app/node_modules/electron')
          const pkg = JSON.parse(fs.readFileSync(path.join(electronDir, 'package.json'), 'utf8'))
          if (pkg.version !== '33.4.11') throw new Error(`Unexpected Electron package version: ${pkg.version}`)
          const file = `electron-v${pkg.version}-${process.env.ELECTRON_PLATFORM}-${process.env.ELECTRON_ARCH}.zip`
          const expected = JSON.parse(fs.readFileSync(path.join(electronDir, 'checksums.json'), 'utf8'))[file]
          if (!expected) throw new Error(`Pinned Electron checksum is missing: ${file}`)
          const archive = process.env.ELECTRON_ARCHIVE
          const actual = crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex')
          if (actual !== expected) throw new Error(`Official Electron asset failed the package-pinned checksum: ${file}`)
          const url = `https://github.com/electron/electron/releases/download/v${pkg.version}/${file}`
          const { Cache } = require(path.resolve(electronDir, '../@electron/get/dist/cjs/Cache.js'))
          new Cache().putFileInCache(url, archive, file).then(() => console.log(`Seeded verified Electron cache for ${file}`))
            .catch(error => { console.error(error.message); process.exitCode = 1 })
          NODE
          node apps/tether-app/node_modules/electron/install.js
      - name: Install shared APP web UI dependencies
        run: npm ci --prefix packages/tether-ui
      - name: Build headless Tether Python command runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check . 'pyinstaller==6.22.3'
          mkdir -p .runtime/desktop-candidate
          COLLECT_ARGS=(--collect-all psutil)
          DATA_ARGS=()
          CONSOLE_PAGE="$(python -c "from pathlib import Path; print(Path('tether/node/console.html').resolve().as_posix())")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            COLLECT_ARGS+=(--collect-all winpty)
            DATA_ARGS+=(--add-data "$CONSOLE_PAGE;tether/node")
          else
            DATA_ARGS+=(--add-data "$CONSOLE_PAGE:tether/node")
          fi
          python -m PyInstaller --noconfirm --clean --onefile \
            --name tether-python \
            --distpath .runtime/desktop-candidate \
            --workpath "$RUNNER_TEMP/tether-pyinstaller" \
            --specpath "$RUNNER_TEMP/tether-pyinstaller" \
            --hidden-import tether.node.agent \
            --hidden-import tether.node.pair_cli \
            --hidden-import tether.updates_cli \
            --collect-all deepseek_harness \
            --collect-all deepseek_harness_runtime \
            --collect-all fastapi \
            --collect-all starlette \
            --collect-all uvicorn \
            --collect-all pydantic \
            --collect-all anyio \
            --collect-all mcp.server \
            --collect-all websockets \
            --collect-all cryptography \
            --collect-all zstandard \
            --collect-all dotenv \
            "${DATA_ARGS[@]}" \
            "${COLLECT_ARGS[@]}" \
            desktop/packaging/python_dispatch.py
      - name: Download the pinned Codeg web runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-pinned-codeg-web
          path: .runtime/codeg-web
      - name: Download the verified pinned Herdr runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-pinned-herdr-runtime
          path: .runtime/herdr-runtime
      - name: Assemble pinned runtime components
        run: python desktop/packaging/prepare_runtime.py --target ${{ matrix.target }} --codeg-web .runtime/codeg-web --herdr-runtime .runtime/herdr-runtime
      - name: Check the frozen Python and bundled Node entry points
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = if ($env:RUNNER_OS -eq 'Windows') { '.runtime/desktop-candidate/tether-python.exe' } else { '.runtime/desktop-candidate/tether-python' }
          $node = if ($env:RUNNER_OS -eq 'Windows') { '.runtime/desktop-candidate/components/nodejs/node.exe' } else { '.runtime/desktop-candidate/components/nodejs/bin/node' }
          if (!(Test-Path -LiteralPath $python -PathType Leaf)) { throw "Frozen Python runtime missing: $python" }
          if (!(Test-Path -LiteralPath $node -PathType Leaf)) { throw "Bundled Node runtime missing: $node" }
          & $python -m tether.node.agent --help
          if ($LASTEXITCODE -ne 0) { throw "Frozen Python entry check failed with exit $LASTEXITCODE" }
          & $python -m tether.node.pair_cli --help
          if ($LASTEXITCODE -ne 0) { throw "Frozen Node pairing entry check failed with exit $LASTEXITCODE" }
          & $node --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node entry check failed with exit $LASTEXITCODE" }
      - name: Check the bundled LibreOffice runtime
        if: matrix.target == 'linux-x64'
        shell: bash
        run: .runtime/desktop-candidate/components/libreoffice/opt/libreoffice26.8/program/soffice --headless --version
      - name: Check the bundled DSH PTY and native dependencies
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $node = if ($env:RUNNER_OS -eq 'Windows') { '.runtime/desktop-candidate/components/nodejs/node.exe' } else { '.runtime/desktop-candidate/components/nodejs/bin/node' }
          $env:TETHER_DSH_RUNTIME_DIR = (Resolve-Path -LiteralPath '.runtime/desktop-candidate/components/dsh').Path
          & $node desktop/packaging/check-dsh-native.js
          if ($LASTEXITCODE -ne 0) { throw "Bundled DSH native check failed with exit $LASTEXITCODE" }
      - name: Build standalone headless Linux Node runtime
        if: matrix.target == 'linux-x64'
        run: python desktop/packaging/build_headless_node.py
      - name: Download and verify pinned nFPM
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          nfpm_dir="$RUNNER_TEMP/nfpm-2.48.0"
          mkdir -p "$nfpm_dir"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            'https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz' \
            -o "$nfpm_dir/nfpm.tar.gz"
          echo '6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  '"$nfpm_dir/nfpm.tar.gz" | sha256sum --check
          tar -xzf "$nfpm_dir/nfpm.tar.gz" -C "$nfpm_dir" nfpm
          chmod 0755 "$nfpm_dir/nfpm"
          echo "NFPM_EXECUTABLE=$nfpm_dir/nfpm" >> "$GITHUB_ENV"
          echo "NFPM_ARCHIVE=$nfpm_dir/nfpm.tar.gz" >> "$GITHUB_ENV"
      - name: Build headless Debian package
        if: matrix.target == 'linux-x64'
        run: python desktop/packaging/build_headless_deb.py --nfpm "$NFPM_EXECUTABLE" --nfpm-archive "$NFPM_ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.target == 'linux-x64'
        with:
          name: tether-node-runtime-linux-x64-${{ steps.source-version.outputs.release_version }}-preview
          path: .scratch/tether-desktop-candidates/${{ steps.source-version.outputs.release_version }}/headless/linux-x64/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Create macOS application icon
        if: matrix.platform == 'macos'
        shell: bash
        run: bash desktop/packaging/prepare-macos-icon.sh
      - name: Package installer candidate
        run: npm run build:${{ matrix.platform }} --prefix desktop/packaging -- ${{ matrix.arch }}
      - name: Upload preview package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tether-${{ matrix.target }}-${{ steps.source-version.outputs.release_version }}-preview
          path: |
            .scratch/tether-desktop-candidates/${{ steps.source-version.outputs.release_version }}/${{ matrix.target }}/*.exe
            .scratch/tether-desktop-candidates/${{ steps.source-version.outputs.release_version }}/${{ matrix.target }}/*.dmg
            .scratch/tether-desktop-candidates/${{ steps.source-version.outputs.release_version }}/${{ matrix.target }}/*.zip
            .scratch/tether-desktop-candidates/${{ steps.source-version.outputs.release_version }}/${{ matrix.target }}/*.AppImage
            .scratch/tether-desktop-candidates/${{ steps.source-version.outputs.release_version }}/${{ matrix.target }}/*.deb
            .scratch/tether-desktop-candidates/${{ steps.source-version.outputs.release_version }}/${{ matrix.target }}/*.yml
            .scratch/tether-desktop-candidates/${{ steps.source-version.outputs.release_version }}/${{ matrix.target }}/*.blockmap
            .scratch/tether-desktop-candidates/${{ steps.source-version.outputs.release_version }}/${{ matrix.target }}/SHA256SUMS.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish-preview-draft:
    name: Sign and assemble preview draft
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/codex/tether-050-preview-20261108' && !contains(github.event.head_commit.message, '[posix-only]') && (contains(github.event.head_commit.message, '[preview-publish-only]') || (needs.build-codeg-web.result == 'success' && needs.package.result == 'success')) }}
    needs: [build-codeg-web, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: packages/tether-ui/package-lock.json
      - name: Build the source UI for signed release archives
        run: |
          npm ci --prefix packages/tether-ui
          npm run build:web --prefix packages/tether-ui
          node -e "const fs=require('node:fs'); const p='packages/tether-ui/web/dist/app.js'; const s=fs.readFileSync(p,'utf8'); for (const marker of ['hubAuthRequiredRef.current','workbenchLogin','oidc_identity_unbound']) if (!s.includes(marker)) throw new Error('Built UI missing marker: '+marker); console.log('Built release UI:',p,fs.statSync(p).size)"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Load and validate release version from source
        id: source-version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content -Raw version.json | ConvertFrom-Json
          $app = Get-Content -Raw apps/tether-app/package.json | ConvertFrom-Json
          $lock = Get-Content -Raw apps/tether-app/package-lock.json | ConvertFrom-Json -AsHashtable
          $candidateVersion = [string]$release.components.app
          if ($candidateVersion -notmatch '^\d+\.\d+\.\d+$' -or $release.components.node -ne $candidateVersion -or $app.version -ne $candidateVersion -or $lock['version'] -ne $candidateVersion -or $lock['packages'][''].version -ne $candidateVersion) { throw 'APP, Node, and APP lockfile versions must match version.json.' }
          if ($release.components.plugin -ne '0.2.93') { throw 'The candidate must retain the frozen DSH plugin version 0.2.93.' }
          "TETHER_RELEASE_VERSION=$candidateVersion" >> $env:GITHUB_ENV
          "release_version=$candidateVersion" >> $env:GITHUB_OUTPUT
      - name: Install manifest signing dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<50' 'PyYAML==6.0.2' 'psutil==7.2.2'
      - name: Verify fixed POSIX package source run
        if: ${{ contains(github.event.head_commit.message, '[windows-recovery]') || contains(github.event.head_commit.message, '[preview-publish-only]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = 'qi001007/tether-harness'
          run_id = 42520196405
          expected_sha = '97aa80f20f32c25ed9ad3ad99078d28d8e07924c'
          api = 'https://api.github.com/repos/' + repository
          token = os.environ['GH_TOKEN']

          def get(path):
              request = urllib.request.Request(api + path, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + token,
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read())

          run = get('/actions/runs/' + str(run_id))
          if run.get('id') != run_id or run.get('status') != 'completed':
              raise SystemExit('fixed POSIX source run is not complete or has an unexpected ID')
          if (run.get('path') != '.github/workflows/tether-desktop-candidate.yml'
                  or run.get('head_branch') != 'codex/tether-050-preview-20261108'
                  or run.get('head_sha') != expected_sha
                  or (run.get('repository') or {}).get('full_name') != repository
                  or (run.get('head_repository') or {}).get('full_name') != repository):
              raise SystemExit('fixed POSIX source run repository, workflow, or head SHA mismatch')

          jobs = get('/actions/runs/' + str(run_id) + '/jobs?per_page=100').get('jobs', [])
          required_jobs = {'Build pinned Codeg web runtime', 'linux-x64', 'macos-x64', 'macos-arm64'}
          successful_jobs = {job.get('name') for job in jobs
                             if job.get('status') == 'completed' and job.get('conclusion') == 'success'}
          if not required_jobs.issubset(successful_jobs):
              raise SystemExit('fixed POSIX source run lacks successful jobs: '
                               + ', '.join(sorted(required_jobs - successful_jobs)))

          required_artifacts = {
              'tether-linux-x64-0.5.0-preview',
              'tether-macos-x64-0.5.0-preview',
              'tether-macos-arm64-0.5.0-preview',
              'tether-node-runtime-linux-x64-0.5.0-preview',
          }
          artifacts = get('/actions/runs/' + str(run_id) + '/artifacts?per_page=100').get('artifacts', [])
          available = {item.get('name'): item for item in artifacts}
          missing = required_artifacts - available.keys()
          if missing:
              raise SystemExit('fixed POSIX source run lacks artifacts: ' + ', '.join(sorted(missing)))
          for name in sorted(required_artifacts):
              artifact = available[name]
              source = artifact.get('workflow_run') or {}
              if (artifact.get('expired') or not str(artifact.get('digest', '')).startswith('sha256:')
                      or source.get('id') != run_id or source.get('head_sha') != expected_sha):
                  raise SystemExit('fixed POSIX artifact provenance or integrity metadata mismatch: ' + name)
          print('Verified fixed POSIX artifacts from run %s at %s: %s' %
                (run_id, expected_sha, ', '.join(sorted(required_artifacts))))
          PY
      - name: Verify fixed Windows package source run
        if: ${{ contains(github.event.head_commit.message, '[preview-publish-only]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = 'qi001007/tether-harness'
          run_id = 42523512038
          expected_sha = '898976b2319261012df8b4da77fa643b9e2f6360'
          api = 'https://api.github.com/repos/' + repository
          token = os.environ['GH_TOKEN']

          def get(path):
              request = urllib.request.Request(api + path, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + token,
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read())

          run = get('/actions/runs/' + str(run_id))
          if run.get('id') != run_id or run.get('status') != 'completed':
              raise SystemExit('fixed Windows source run is not complete or has an unexpected ID')
          if (run.get('path') != '.github/workflows/tether-desktop-candidate.yml'
                  or run.get('head_branch') != 'codex/tether-050-preview-20261108'
                  or run.get('head_sha') != expected_sha
                  or (run.get('repository') or {}).get('full_name') != repository
                  or (run.get('head_repository') or {}).get('full_name') != repository):
              raise SystemExit('fixed Windows source run repository, workflow, or head SHA mismatch')

          jobs = get('/actions/runs/' + str(run_id) + '/jobs?per_page=100').get('jobs', [])
          required_jobs = {'Build pinned Codeg web runtime', 'windows-x64'}
          successful_jobs = {job.get('name') for job in jobs
                             if job.get('status') == 'completed' and job.get('conclusion') == 'success'}
          if not required_jobs.issubset(successful_jobs):
              raise SystemExit('fixed Windows source run lacks successful jobs: '
                               + ', '.join(sorted(required_jobs - successful_jobs)))

          name = 'tether-windows-x64-0.5.0-preview'
          artifacts = get('/actions/runs/' + str(run_id) + '/artifacts?per_page=100').get('artifacts', [])
          artifact = next((item for item in artifacts if item.get('name') == name), None)
          if artifact is None or artifact.get('expired'):
              raise SystemExit('fixed Windows source artifact is missing or expired')
          source = artifact.get('workflow_run') or {}
          if (artifact.get('id') != 13635146500
                  or artifact.get('size_in_bytes') != 1036137974
                  or artifact.get('digest') != 'sha256:176c3cd7a49864ebe9e6d0888d10b840ce8d41b55e5afb3d30b3f92cae52b524'
                  or source.get('id') != run_id or source.get('head_sha') != expected_sha):
              raise SystemExit('fixed Windows artifact provenance or integrity metadata mismatch')
          print('Verified fixed Windows artifact from run %s at %s' % (run_id, expected_sha))
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ !contains(github.event.head_commit.message, '[windows-recovery]') && !contains(github.event.head_commit.message, '[preview-publish-only]') }}
