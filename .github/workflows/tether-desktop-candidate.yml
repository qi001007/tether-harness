      - name: Download macOS x64 package from verified source run
        if: ${{ contains(github.event.head_commit.message, '[windows-recovery]') || contains(github.event.head_commit.message, '[preview-publish-only]') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-macos-x64-0.5.0-preview
          path: .release-inputs/tether-macos-x64-0.5.0-preview
          github-token: ${{ github.token }}
          repository: qi001007/tether-harness
          run-id: 42520196405
      - name: Download macOS arm64 package from verified source run
        if: ${{ contains(github.event.head_commit.message, '[windows-recovery]') || contains(github.event.head_commit.message, '[preview-publish-only]') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-macos-arm64-0.5.0-preview
          path: .release-inputs/tether-macos-arm64-0.5.0-preview
          github-token: ${{ github.token }}
          repository: qi001007/tether-harness
