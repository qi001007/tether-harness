name: Tether desktop preview candidate

on:
  push:
    branches:
      - 'codex/tether-052-preview-20261111'
      - 'codex/tether-053-business-20261112'
      - 'codex/tether-054-session-20261112'
      - 'codex/tether-055-native-mode-20261112'
      - 'codex/tether-056-reconnect-20261113'
      - 'codex/tether-057-recovery-20261113'
      - 'codex/tether-058-herdr-20261113'
  workflow_dispatch:

env:
  CANDIDATE_VERSION: ${{ github.ref == 'refs/heads/codex/tether-058-herdr-20261113' && '0.5.8' || github.ref == 'refs/heads/codex/tether-057-recovery-20261113' && '0.5.7' || github.ref == 'refs/heads/codex/tether-056-reconnect-20261113' && '0.5.6' || github.ref == 'refs/heads/codex/tether-055-native-mode-20261112' && '0.5.5' || github.ref == 'refs/heads/codex/tether-054-session-20261112' && '0.5.4' || github.ref == 'refs/heads/codex/tether-053-business-20261112' && '0.5.3' || '0.5.2' }}
  CANDIDATE_TAG: ${{ github.ref == 'refs/heads/codex/tether-058-herdr-20261113' && 'v0.5.8-preview.1' || github.ref == 'refs/heads/codex/tether-057-recovery-20261113' && 'v0.5.7-preview.1' || github.ref == 'refs/heads/codex/tether-056-reconnect-20261113' && 'v0.5.6-preview.1' || github.ref == 'refs/heads/codex/tether-055-native-mode-20261112' && 'v0.5.5-preview.1' || github.ref == 'refs/heads/codex/tether-054-session-20261112' && 'v0.5.4-preview.1' || github.ref == 'refs/heads/codex/tether-053-business-20261112' && 'v0.5.3-preview.1' || 'v0.5.2-preview.1' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-codeg-web:
    name: Build pinned Codeg web runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spacering-net/codeg
          ref: e3171d69d208bdf37697b15e8b14f8c9b70825bf
          path: .runtime/codeg-source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Install the pinned Codeg dependencies
        working-directory: .runtime/codeg-source
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack pnpm install --frozen-lockfile
      - name: Build the Codeg static runtime from source
        shell: pwsh
        env:
          CODEG_GALLERY: '0'
          NEXT_TELEMETRY_DISABLED: '1'
        run: ./scripts/build_codeg_runtime.ps1 -ExportDirectory .runtime/codeg-built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tether-pinned-codeg-web
          path: .runtime/codeg-built/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
  package:
    name: ${{ matrix.target }}
    needs: build-codeg-web
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.event.head_commit.message, '[posix-only]') && '[{"target":"linux-x64","runner":"ubuntu-22.04","platform":"linux","arch":"x64"},{"target":"macos-x64","runner":"macos-15-intel","platform":"macos","arch":"x64"},{"target":"macos-arm64","runner":"macos-15","platform":"macos","arch":"arm64"}]' || '[{"target":"windows-x64","runner":"windows-latest","platform":"windows","arch":"x64"},{"target":"linux-x64","runner":"ubuntu-22.04","platform":"linux","arch":"x64"},{"target":"macos-x64","runner":"macos-15-intel","platform":"macos","arch":"x64"},{"target":"macos-arm64","runner":"macos-15","platform":"macos","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'macos-x64' && 65 || 35 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: |
            apps/tether-app/package-lock.json
            packages/tether-ui/package-lock.json
            desktop/packaging/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Validate candidate version and frozen plugin channel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content -Raw version.json | ConvertFrom-Json
          $app = Get-Content -Raw apps/tether-app/package.json | ConvertFrom-Json
          $candidateVersion = $env:CANDIDATE_VERSION
          if ($release.components.app -ne $candidateVersion -or $release.components.node -ne $candidateVersion -or $app.version -ne $candidateVersion) { throw "APP and Node candidate versions must all be $candidateVersion." }
          if ($release.components.plugin -ne '0.2.93') { throw 'The candidate must retain the frozen DSH plugin version 0.2.93.' }
      - name: Install pinned desktop packaging tools
        run: npm ci --prefix desktop/packaging
      - name: Install APP production dependencies
        run: npm ci --prefix apps/tether-app
      - name: Install and build the shared APP web UI
        run: |
          npm ci --prefix packages/tether-ui
          npm run build:web --prefix packages/tether-ui
          node -e "const fs=require('node:fs'); if (!fs.statSync('packages/tether-ui/web/dist/app.js').isFile()) process.exit(1)"
      - name: Build headless Tether Python command runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check . 'pyinstaller==6.22.3'
          mkdir -p .runtime/desktop-candidate
          COLLECT_ARGS=(--collect-all psutil)
          DATA_ARGS=()
          CONSOLE_PAGE="$(python -c "from pathlib import Path; print(Path('tether/node/console.html').resolve().as_posix())")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            COLLECT_ARGS+=(--collect-all winpty)
            DATA_ARGS+=(--add-data "$CONSOLE_PAGE;tether/node")
          else
            DATA_ARGS+=(--add-data "$CONSOLE_PAGE:tether/node")
          fi
          python -m PyInstaller --noconfirm --clean --onefile \
            --name tether-python \
            --distpath .runtime/desktop-candidate \
            --workpath "$RUNNER_TEMP/tether-pyinstaller" \
            --specpath "$RUNNER_TEMP/tether-pyinstaller" \
            --hidden-import tether.node.agent \
            --hidden-import tether.node.pair_cli \
            --hidden-import tether.updates_cli \
            --collect-all deepseek_harness \
            --collect-all deepseek_harness_runtime \
            --collect-all fastapi \
            --collect-all starlette \
            --collect-all uvicorn \
            --collect-all pydantic \
            --collect-all anyio \
            --collect-all mcp.server \
            --collect-all websockets \
            --collect-all cryptography \
            --collect-all zstandard \
            --collect-all dotenv \
            "${DATA_ARGS[@]}" \
            "${COLLECT_ARGS[@]}" \
            desktop/packaging/python_dispatch.py
      - name: Download the pinned Codeg web runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-pinned-codeg-web
          path: .runtime/codeg-web
      - name: Hydrate pinned Herdr runtime
        run: python scripts/hydrate_herdr_runtime.py --destination .runtime/herdr-runtime
      - name: Assemble pinned runtime components
        run: python desktop/packaging/prepare_runtime.py --target ${{ matrix.target }} --codeg-web .runtime/codeg-web --herdr-runtime .runtime/herdr-runtime
      - name: Check the frozen Python and bundled Node entry points
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = if ($env:RUNNER_OS -eq 'Windows') { '.runtime/desktop-candidate/tether-python.exe' } else { '.runtime/desktop-candidate/tether-python' }
          $node = if ($env:RUNNER_OS -eq 'Windows') { '.runtime/desktop-candidate/components/nodejs/node.exe' } else { '.runtime/desktop-candidate/components/nodejs/bin/node' }
          if (!(Test-Path -LiteralPath $python -PathType Leaf)) { throw "Frozen Python runtime missing: $python" }
          if (!(Test-Path -LiteralPath $node -PathType Leaf)) { throw "Bundled Node runtime missing: $node" }
          & $python -m tether.node.agent --help
          if ($LASTEXITCODE -ne 0) { throw "Frozen Python entry check failed with exit $LASTEXITCODE" }
          & $python -m tether.node.pair_cli --help
          if ($LASTEXITCODE -ne 0) { throw "Frozen Node pairing entry check failed with exit $LASTEXITCODE" }
          & $node --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node entry check failed with exit $LASTEXITCODE" }
      - name: Check the bundled LibreOffice runtime
        if: matrix.target == 'linux-x64'
        shell: bash
        run: .runtime/desktop-candidate/components/libreoffice/opt/libreoffice26.8/program/soffice --headless --version
      - name: Check the bundled DSH PTY and native dependencies
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $node = if ($env:RUNNER_OS -eq 'Windows') { '.runtime/desktop-candidate/components/nodejs/node.exe' } else { '.runtime/desktop-candidate/components/nodejs/bin/node' }
          $env:TETHER_DSH_RUNTIME_DIR = (Resolve-Path -LiteralPath '.runtime/desktop-candidate/components/dsh').Path
          & $node desktop/packaging/check-dsh-native.js
          if ($LASTEXITCODE -ne 0) { throw "Bundled DSH native check failed with exit $LASTEXITCODE" }
      - name: Build standalone headless Linux Node runtime
        if: matrix.target == 'linux-x64'
        run: python desktop/packaging/build_headless_node.py
      - name: Download and verify pinned nFPM
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          nfpm_dir="$RUNNER_TEMP/nfpm-2.48.0"
          mkdir -p "$nfpm_dir"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            'https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz' \
            -o "$nfpm_dir/nfpm.tar.gz"
          echo '6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  '"$nfpm_dir/nfpm.tar.gz" | sha256sum --check
          tar -xzf "$nfpm_dir/nfpm.tar.gz" -C "$nfpm_dir" nfpm
          chmod 0755 "$nfpm_dir/nfpm"
          echo "NFPM_EXECUTABLE=$nfpm_dir/nfpm" >> "$GITHUB_ENV"
          echo "NFPM_ARCHIVE=$nfpm_dir/nfpm.tar.gz" >> "$GITHUB_ENV"
      - name: Build headless Debian package
        if: matrix.target == 'linux-x64'
        run: python desktop/packaging/build_headless_deb.py --nfpm "$NFPM_EXECUTABLE" --nfpm-archive "$NFPM_ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.target == 'linux-x64'
        with:
          name: tether-node-runtime-linux-x64-${{ env.CANDIDATE_VERSION }}-preview
          path: .scratch/tether-desktop-candidates/${{ env.CANDIDATE_VERSION }}/headless/linux-x64/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Create macOS application icon
        if: matrix.platform == 'macos'
        shell: bash
        run: bash desktop/packaging/prepare-macos-icon.sh
      - name: Package installer candidate
        run: npm run build:${{ matrix.platform }} --prefix desktop/packaging -- ${{ matrix.arch }}
      - name: Upload preview package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tether-${{ matrix.target }}-${{ env.CANDIDATE_VERSION }}-preview
          path: |
            .scratch/tether-desktop-candidates/${{ env.CANDIDATE_VERSION }}/${{ matrix.target }}/*.exe
            .scratch/tether-desktop-candidates/${{ env.CANDIDATE_VERSION }}/${{ matrix.target }}/*.dmg
            .scratch/tether-desktop-candidates/${{ env.CANDIDATE_VERSION }}/${{ matrix.target }}/*.zip
            .scratch/tether-desktop-candidates/${{ env.CANDIDATE_VERSION }}/${{ matrix.target }}/*.AppImage
            .scratch/tether-desktop-candidates/${{ env.CANDIDATE_VERSION }}/${{ matrix.target }}/*.deb
            .scratch/tether-desktop-candidates/${{ env.CANDIDATE_VERSION }}/${{ matrix.target }}/*.yml
            .scratch/tether-desktop-candidates/${{ env.CANDIDATE_VERSION }}/${{ matrix.target }}/*.blockmap
            .scratch/tether-desktop-candidates/${{ env.CANDIDATE_VERSION }}/${{ matrix.target }}/SHA256SUMS.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish-preview-draft:
    name: Sign and assemble preview draft
    if: ${{ (github.ref == 'refs/heads/codex/tether-052-preview-20261111' || github.ref == 'refs/heads/codex/tether-053-business-20261112' || github.ref == 'refs/heads/codex/tether-054-session-20261112' || github.ref == 'refs/heads/codex/tether-055-native-mode-20261112' || github.ref == 'refs/heads/codex/tether-056-reconnect-20261113' || github.ref == 'refs/heads/codex/tether-057-recovery-20261113' || github.ref == 'refs/heads/codex/tether-058-herdr-20261113') && !contains(github.event.head_commit.message, '[posix-only]') }}
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Install and build the shared APP web UI for source archives
        run: |
          npm ci --prefix packages/tether-ui
          npm run build:web --prefix packages/tether-ui
          node -e "const fs=require('node:fs'); if (!fs.statSync('packages/tether-ui/web/dist/app.js').isFile()) process.exit(1)"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install manifest signing dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<50' 'PyYAML==6.0.2' 'psutil==7.2.2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: 'tether-*-${{ env.CANDIDATE_VERSION }}-preview'
          path: .release-inputs
      - name: Fetch the fixed original DSH plugin release metadata and archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-frozen-plugin
          base='https://github.com/qi001007/tether-harness/releases/download/v0.2.93'
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            "$base/tether-update.json" -o .release-frozen-plugin/tether-update.json
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            "$base/tether-plugin-0.2.93.zip" -o .release-frozen-plugin/tether-plugin-0.2.93.zip
          echo '08f33b371de45895316a3e132f40c11976ed30cdd2fceebc38bcab2608c1f9df  .release-frozen-plugin/tether-plugin-0.2.93.zip' | sha256sum --check
      - name: Hydrate pinned Windows Herdr files for the Node update archive
        run: python scripts/hydrate_herdr_runtime.py --windows-only --destination .release-herdr-runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tether-pinned-codeg-web
          path: .release-codeg-web
      - name: Replace stale Codeg runtime web in the isolated release checkout
        run: |
          python - <<'PY'
          import json
          import hashlib
          import shutil
          from pathlib import Path

          root = Path.cwd().resolve()
          source = (root / '.release-codeg-web').resolve()
          relative_web = Path('tether/node/bin/agents-runtime/web')
          web = root / relative_web
          required = ('index.html', 'login.html', 'workspace.html', 'token.html')

          def summarize(directory):
              files = sorted((path for path in directory.rglob('*') if path.is_file()),
                             key=lambda path: path.relative_to(directory).as_posix())
              pages = {}
              for name in required:
                  path = directory / name
                  if not path.is_file():
                      raise SystemExit(f'Codeg web artifact is missing required page: {name}')
                  pages[name] = hashlib.sha256(path.read_bytes()).hexdigest()
              return {
                  'files': len(files),
                  'bytes': sum(path.stat().st_size for path in files),
                  'pages': pages,
              }

          if not source.is_dir():
              raise SystemExit('Pinned Codeg web artifact is missing.')
          resolved_web = web.resolve()
          if resolved_web != root / relative_web or not resolved_web.is_relative_to(root):
              raise SystemExit('Refusing to replace a Codeg web directory outside this checkout.')
          source_summary = summarize(source)
          if web.is_symlink():
              raise SystemExit('Refusing to replace a linked Codeg web directory.')
          if web.exists():
              shutil.rmtree(web)
          shutil.copytree(source, web)
          target_summary = summarize(web)
          if source_summary != target_summary:
              raise SystemExit(f'Codeg web copy mismatch: source={source_summary}, target={target_summary}')
          print(json.dumps({'status': 'verified', 'web': relative_web.as_posix(), **target_summary},
                           sort_keys=True, separators=(',', ':')))
          PY
      - name: Create signed preview manifest and source archives
        env:
          TETHER_RELEASE_PRIVATE_KEY: ${{ secrets.TETHER_RELEASE_PRIVATE_KEY }}
          TETHER_REQUIRE_SIGNED_RELEASE: '1'
        run: |
          python scripts/build_release.py \
            --channel preview \
            --release-tag "$CANDIDATE_TAG" \
            --frozen-plugin-manifest .release-frozen-plugin/tether-update.json \
            --frozen-plugin-archive .release-frozen-plugin/tether-plugin-0.2.93.zip \
            --node-deb ".release-inputs/tether-node-runtime-linux-x64-$CANDIDATE_VERSION-preview/Tether-node-runtime-$CANDIDATE_VERSION-linux-x64.deb" \
            --herdr-runtime .release-herdr-runtime \
            --output-dir .release-manifest
      - name: Assemble unique draft release assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path
          import yaml

          candidate_version = os.environ['CANDIDATE_VERSION']
          inputs = Path('.release-inputs')
          expected = {
              f'tether-windows-x64-{candidate_version}-preview', f'tether-linux-x64-{candidate_version}-preview',
              f'tether-macos-x64-{candidate_version}-preview', f'tether-macos-arm64-{candidate_version}-preview',
              f'tether-node-runtime-linux-x64-{candidate_version}-preview',
          }
          artifacts = {path.name: path for path in inputs.iterdir() if path.is_dir()}
          if not expected.issubset(artifacts):
              raise SystemExit('missing candidate artifacts: ' + ', '.join(sorted(expected - artifacts.keys())))
          output = Path('release-assets')
          output.mkdir()

          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(block)
              return value.hexdigest()

          def add_file(source, expected_sha=None, expected_size=None, target_name=None):
              target_name = target_name or source.name
              if Path(target_name).name != target_name or '\\' in target_name or target_name in {'.', '..'}:
                  raise SystemExit('unsafe release filename: ' + target_name)
              if not source.is_file():
                  raise SystemExit('listed release asset is missing: ' + str(source))
              current = digest(source)
              if expected_sha and current.lower() != expected_sha.lower():
                  raise SystemExit('release asset digest mismatch: ' + source.name)
              if expected_size is not None and source.stat().st_size != expected_size:
                  raise SystemExit('release asset size mismatch: ' + source.name)
              target = output / target_name
              if target.exists():
                  if digest(target) != current:
                      raise SystemExit('release asset name collision: ' + source.name)
                  return
              shutil.copy2(source, target)

          for artifact_name in sorted(expected - {f'tether-node-runtime-linux-x64-{candidate_version}-preview'}):
              artifact_dir = artifacts[artifact_name]
              checksum_file = artifact_dir / 'SHA256SUMS.json'
              if not checksum_file.is_file():
                  raise SystemExit('candidate package has no SHA256SUMS.json: ' + artifact_name)
              checksum = json.loads(checksum_file.read_text(encoding='utf-8'))
              target = artifact_name.removeprefix('tether-').removesuffix(f'-{candidate_version}-preview')
              if checksum.get('version') != candidate_version or checksum.get('platform') != target:
                  raise SystemExit('candidate checksum manifest version or platform mismatch: ' + artifact_name)
              normalized_artifacts = []
              for item in checksum.get('artifacts', []):
                  name = item.get('name')
                  if not isinstance(name, str) or Path(name).name != name:
                      raise SystemExit('unsafe filename in candidate checksum manifest')
                  target_name = name
                  if name == 'preview-mac.yml':
                      if artifact_name not in {f'tether-macos-x64-{candidate_version}-preview', f'tether-macos-arm64-{candidate_version}-preview'}:
                          raise SystemExit('unexpected preview-mac.yml outside a macOS artifact')
                      architecture = 'x64' if artifact_name == f'tether-macos-x64-{candidate_version}-preview' else 'arm64'
                      target_name = f'preview-mac-{architecture}.yml'
                  add_file(artifact_dir / name, item.get('sha256'), item.get('size'), target_name)
                  normalized_artifacts.append({**item, 'name': target_name})
              checksum['artifacts'] = normalized_artifacts
              (output / (artifact_name + '.SHA256SUMS.json')).write_text(
                  json.dumps(checksum, indent=2) + '\n', encoding='utf-8')

          mac_manifests = []
          for architecture in ('x64', 'arm64'):
              path = output / f'preview-mac-{architecture}.yml'
              if not path.is_file():
                  raise SystemExit('macOS candidate metadata missing: ' + path.name)
              info = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(info, dict) or info.get('version') != candidate_version or not isinstance(info.get('files'), list):
                  raise SystemExit('invalid electron-updater metadata: ' + path.name)
              expected_arch_token = f'mac-{architecture}'
              matching_zips = [item for item in info['files'] if isinstance(item, dict)
                               and isinstance(item.get('url'), str)
                               and item['url'].lower().endswith('.zip')
                               and expected_arch_token in item['url'].lower()]
              if not matching_zips or any(not item.get('sha512') or not isinstance(item.get('size'), int)
                                          for item in matching_zips):
                  raise SystemExit('macOS metadata lacks the architecture-specific updater zip: ' + path.name)
              mac_manifests.append(info)
          if mac_manifests[0]['version'] != mac_manifests[1]['version']:
              raise SystemExit('macOS update metadata versions differ')
          merged = dict(mac_manifests[0])
          merged.pop('path', None)
          merged.pop('sha512', None)
          merged.pop('sha2', None)
          files_by_url = {}
          for info in mac_manifests:
              for item in info['files']:
                  if not isinstance(item, dict) or not isinstance(item.get('url'), str):
                      raise SystemExit('invalid file entry in macOS update metadata')
                  previous = files_by_url.get(item['url'])
                  if previous is not None and previous != item:
                      raise SystemExit('conflicting macOS update metadata for ' + item['url'])
                  files_by_url[item['url']] = item
          merged['files'] = [files_by_url[url] for url in sorted(files_by_url)]
          dates = [str(info['releaseDate']) for info in mac_manifests if info.get('releaseDate') is not None]
          if dates:
              merged['releaseDate'] = max(dates)
          (output / 'preview-mac.yml').write_text(yaml.safe_dump(merged, sort_keys=False), encoding='utf-8')
          (output / 'preview-mac-x64.yml').unlink()
          (output / 'preview-mac-arm64.yml').unlink()

          headless = artifacts[f'tether-node-runtime-linux-x64-{candidate_version}-preview']
          headless_names = {
              f'Tether-node-runtime-{candidate_version}-linux-x64.tar.gz',
              f'Tether-node-runtime-{candidate_version}-linux-x64.tar.gz.sha256',
              f'Tether-node-runtime-{candidate_version}-linux-x64.deb',
              f'Tether-node-runtime-{candidate_version}-linux-x64.deb.sha256',
              f'Tether-node-runtime-{candidate_version}-linux-x64.deb.manifest-fragment.json',
          }
          for name in sorted(headless_names):
              add_file(headless / name)

          manifest_dir = Path('.release-manifest')
          builder_names = {'tether-update.json', f'tether-app-{candidate_version}.zip', f'tether-node-{candidate_version}.zip',
                           f'Tether-node-runtime-{candidate_version}-linux-x64.deb'}
          for name in sorted(builder_names):
              add_file(manifest_dir / name)
          required = {f'Tether-{candidate_version}-win-x64.exe', f'Tether-node-runtime-{candidate_version}-linux-x64.tar.gz',
                      f'Tether-node-runtime-{candidate_version}-linux-x64.deb', 'tether-update.json', 'preview-mac.yml'}
          missing = required - {path.name for path in output.iterdir() if path.is_file()}
          if missing:
              raise SystemExit('missing required release files: ' + ', '.join(sorted(missing)))
          print('Prepared', len(list(output.iterdir())), 'whitelisted candidate release assets.')
          PY
