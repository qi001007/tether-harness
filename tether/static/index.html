<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tether</title>
<style>
  :root { --bg:#0b0f14; --panel:#121821; --panel2:#161e29; --line:#233042; --text:#dce5ef;
          --dim:#7f8c9d; --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 "Segoe UI",system-ui,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:11px 18px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; letter-spacing:.4px; }
  #conn { font-size:12px; color:var(--dim); }
  #conn.ok { color:var(--green); }
  #conn.bad { color:var(--red); }
  #agent-title { font-weight:600; }
  #agent-sub { color:var(--dim); font-size:12px; }
  #console-link { margin-left:auto; font-size:12px; color:var(--blue); text-decoration:none; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:250px 1fr 260px; }
  aside { border-right:1px solid var(--line); overflow:auto; padding:12px; background:var(--panel); }
  #status-panel { border-right:none; border-left:1px solid var(--line); }
  section#chat { min-width:0; display:flex; flex-direction:column; background:var(--bg); }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:14px 0 8px; }
  button { font:inherit; cursor:pointer; border-radius:7px; border:1px solid var(--line); background:var(--panel2); color:var(--text); padding:8px 11px; }
  button:hover { border-color:#3a4c63; }
  button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  button.danger { color:#ffb4ad; border-color:#5a1f1f; }
  button:disabled { opacity:.45; cursor:default; }
  #new-chat { width:100%; text-align:left; }
  .agent { display:block; width:100%; text-align:left; margin-bottom:7px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); }
  .agent.sel { border-color:var(--blue); }
  .agent .top { display:flex; align-items:center; gap:7px; }
  .agent .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .agent .meta { color:var(--dim); font-size:11px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--dim); flex:0 0 auto; }
  .dot.on { background:var(--green); }
  .tag { margin-left:auto; font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:1px 6px; }
  .run { display:block; width:100%; text-align:left; padding:7px 8px; margin-bottom:5px; border:1px solid transparent; border-radius:7px; background:transparent; }
  .run:hover { background:var(--panel2); border-color:var(--line); }
  .run .top { display:flex; justify-content:space-between; gap:6px; font-size:12px; }
  .run .p { color:var(--dim); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:10px; padding:1px 6px; border:1px solid var(--line); border-radius:999px; color:var(--dim); }
  .badge.running,.badge.dispatching,.badge.queued,.badge.cancelling { color:var(--amber); border-color:#5a4715; }
  .badge.completed { color:var(--green); border-color:#1f4d2a; }
  .badge.cancelled,.badge.failed,.badge.unknown { color:var(--red); border-color:#5a1f1f; }
  #transcript { flex:1; overflow:auto; padding:22px 8%; }
  .msg { margin:10px 0; display:flex; }
  .msg.user { justify-content:flex-end; }
  .msg .bubble { max-width:78%; padding:10px 13px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .msg.user .bubble { background:#1f6feb; color:#fff; border-bottom-right-radius:3px; }
  .msg.assistant .bubble { background:var(--panel2); border:1px solid var(--line); border-bottom-left-radius:3px; }
  .msg .meta { color:var(--dim); font-size:11px; margin-top:4px; text-align:right; }
  .card { margin:8px 0; padding:8px 11px; border:1px solid var(--line); border-left:2px solid var(--blue); border-radius:6px; background:var(--panel); }
  .card.thought { border-left-color:#5b6675; color:var(--dim); font-style:italic; }
  .card.result { border-left-color:#2f6f4f; }
  .card.error { border-left-color:var(--red); color:#ffb4ad; }
  .card .k { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--dim); margin-bottom:3px; }
  .card pre { margin:3px 0 0; white-space:pre-wrap; word-break:break-word; font:12px/1.45 Consolas,monospace; max-height:220px; overflow:auto; color:var(--text); }
  .working { color:var(--amber); font-size:12px; margin:8px 0; }
  .welcome { color:var(--dim); max-width:620px; margin:12vh auto; text-align:center; line-height:1.8; }
  .welcome b { color:var(--text); }
  .composer { border-top:1px solid var(--line); padding:12px 8% 16px; background:var(--bg); }
  .composer textarea { width:100%; min-height:58px; max-height:180px; resize:vertical; padding:11px 12px; border-radius:9px;
                       border:1px solid var(--line); background:var(--panel2); color:var(--text); font:inherit; }
  .composer .row { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .composer .row .spacer { flex:1; }
  #hint { color:var(--dim); font-size:12px; }
  #session-detail, #agent-detail { color:var(--dim); font-size:12px; line-height:1.7; word-break:break-word; }
  #session-detail b, #agent-detail b { color:var(--text); font-weight:600; }
  .empty { color:var(--dim); padding:8px 0; }
  @media (max-width: 1000px) { main { grid-template-columns:220px 1fr; } #status-panel { display:none; } }
  @media (max-width: 720px) { main { grid-template-columns:1fr; } aside:first-child { display:none; } #transcript { padding:16px; } .composer { padding:10px 16px 14px; } }
</style>
</head>
<body>
<header>
  <h1>Tether</h1>
  <span id="conn">connecting…</span>
  <span id="agent-title">No Agent</span>
  <span id="agent-sub"></span>
  <a id="console-link" href="http://127.0.0.1:18893" target="_blank" style="display:none">Local console ↗</a>
</header>
<main>
  <aside>
    <button id="new-chat">+ New chat</button>
    <h2>Agents</h2>
    <div id="agents"></div>
    <h2>Recent runs</h2>
    <div id="runs"></div>
  </aside>
  <section id="chat">
    <div id="transcript"><div class="welcome">Start a conversation with your local Agent, or switch to a peer on the left.</div></div>
    <div class="composer">
      <textarea id="prompt" placeholder="给你的 Agent 发消息…"></textarea>
      <div class="row">
        <button class="primary" id="send">Send</button>
        <button class="danger" id="cancel" disabled>Cancel run</button>
        <span id="hint"></span>
        <span class="spacer"></span>
      </div>
    </div>
  </section>
  <aside id="status-panel">
    <h2>Agent</h2>
    <div id="agent-detail" class="empty">—</div>
    <h2>Session</h2>
    <div id="session-detail" class="empty">—</div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let state = { devices: [], sessions: [], runs: [], local_device: "DESKTOP-LOCAL" };
let selectedDevice = null;
let sessionId = null;
let transcript = null;
let activeRun = null;
let sessionByDevice = {};
let refreshing = false;
let refreshQueued = false;
let refreshTimer = null;

async function api(path, opts) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) throw new Error((await res.text()).slice(0, 300));
  return res.json();
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function deviceById(id) { return state.devices.find(d => d.device_id === id); }
function activeState(s) { return ["queued","dispatching","running","cancelling"].includes(s); }

function renderAgents() {
  $("agents").innerHTML = state.devices.map(d => {
    const local = d.device_id === state.local_device;
    const agents = (d.capabilities && d.capabilities.agents) || [];
    return `<button class="agent ${d.device_id === selectedDevice ? "sel" : ""}" data-device="${esc(d.device_id)}">
      <div class="top"><span class="dot ${d.online ? "on" : ""}"></span>
        <span class="name">${esc(d.name)}</span>
        <span class="tag">${local ? "local" : "peer"}</span></div>
      <div class="meta">${esc(d.platform || "")} · ${esc(agents.join(", ") || "no agents")}</div>
    </button>`;
  }).join("") || '<div class="empty">Waiting for a node…</div>';
}

function renderRuns() {
  $("runs").innerHTML = state.runs.slice(0, 20).map(r => `
    <button class="run" data-run="${esc(r.run_id)}" data-session="${esc(r.session_id)}" data-device="${esc(r.device_id)}">
      <div class="top"><span>${esc(r.run_id)}</span><span class="badge ${esc(r.state)}">${esc(r.state)}</span></div>
      <div class="p">${esc(r.prompt || "")}</div>
    </button>`).join("") || '<div class="empty">No runs yet.</div>';
}

function renderHeader() {
  const d = deviceById(selectedDevice);
  if (!d) { $("agent-title").textContent = "No Agent"; $("agent-sub").textContent = ""; $("console-link").style.display = "none"; return; }
  const local = d.device_id === state.local_device;
  $("agent-title").textContent = `${d.name} · ${local ? "Local Agent" : "Peer Agent"}`;
  $("agent-sub").textContent = `${d.online ? "online" : "offline"} · ${d.capabilities?.workspace || ""}`;
  $("console-link").style.display = local ? "inline" : "none";
}

function renderStatus() {
  const d = deviceById(selectedDevice);
  if (!d) { $("agent-detail").textContent = "—"; $("session-detail").textContent = "—"; return; }
  const caps = d.capabilities || {};
  $("agent-detail").innerHTML = `
    <div><b>${esc(d.name)}</b> · ${esc(d.online ? "online" : "offline")}</div>
    <div>${esc(d.platform || "")}</div>
    <div>workspace: ${esc(caps.workspace || "—")}</div>
    <div>agents: ${esc((caps.agents || []).join(", ") || "—")}</div>`;
  const s = transcript && transcript.session;
  const ar = activeRun;
  $("session-detail").innerHTML = s ? `
    <div>id: <b>${esc(s.session_id)}</b></div>
    <div>workspace: ${esc(s.workspace)}</div>
    <div>runs: ${transcript.runs.length}</div>
    ${ar ? `<div>active: <b>${esc(ar.run_id)}</b> · ${esc(ar.state)} · ack ${ar.ack_seq}</div>` : "<div>idle</div>"}` : "—";
}

function renderTranscript() {
  const box = $("transcript");
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 90;
  const parts = [];
  if (!transcript || !transcript.runs.length) {
    parts.push(`<div class="welcome">This is <b>${esc(deviceById(selectedDevice)?.name || "your Agent")}</b>.<br>
      Ask it to do something; it runs on that machine.<br>
      Switch to a peer on the left to delegate work to another computer.</div>`);
  } else {
    for (const item of transcript.runs) {
      const run = item.run;
      parts.push(`<div class="msg user"><div><div class="bubble">${esc(run.prompt)}</div>
        <div class="meta">${esc(run.state)} · ${esc(run.run_id)}</div></div></div>`);
      for (const ev of item.events) parts.push(renderEvent(ev));
      if (activeState(run.state)) parts.push(`<div class="working">● Agent is working…</div>`);
    }
  }
  box.innerHTML = parts.join("");
  if (atBottom) box.scrollTop = box.scrollHeight;
  activeRun = null;
  if (transcript) {
    for (const item of transcript.runs) if (activeState(item.run.state)) activeRun = item.run;
  }
  $("cancel").disabled = !activeRun;
  $("send").disabled = !selectedDevice;
  renderStatus();
}

function renderEvent(ev) {
  const p = ev.payload || {};
  if (ev.kind === "thought") {
    return `<div class="card thought"><div class="k">thought</div>${esc(String(p.text || "").slice(0, 400))}</div>`;
  }
  if (ev.kind === "tool") {
    const name = p.name || (p.type === "tool/result" ? "result" : "tool");
    const body = p.command || p.text || p.data || "";
    const cls = p.type === "tool/result" ? "card result" : "card";
    return `<div class="${cls}"><div class="k">${esc(p.type || "tool")} · ${esc(name)}</div><pre>${esc(String(body).slice(0, 1600))}</pre></div>`;
  }
  if (ev.kind === "assistant") {
    return `<div class="msg assistant"><div class="bubble">${esc(p.text || "")}</div></div>`;
  }
  if (ev.kind === "log") {
    const text = p.error || p.reason || p.text || JSON.stringify(p);
    const cls = p.reason === "error" || p.error ? "card error" : "card";
    return `<div class="${cls}"><div class="k">log</div>${esc(String(text).slice(0, 400))}</div>`;
  }
  return "";
}

async function ensureSession(deviceId) {
  if (sessionByDevice[deviceId]) { sessionId = sessionByDevice[deviceId]; return; }
  const existing = state.sessions.find(s => s.device_id === deviceId);
  if (existing) { sessionByDevice[deviceId] = existing.session_id; sessionId = existing.session_id; return; }
  const d = deviceById(deviceId);
  const workspace = (d && d.capabilities && d.capabilities.workspace) || ".";
  const s = await api("/api/sessions", { method: "POST", body: JSON.stringify({ device_id: deviceId, workspace }) });
  state.sessions.push(s);
  sessionByDevice[deviceId] = s.session_id;
  sessionId = s.session_id;
}

async function loadTranscript() {
  if (!sessionId) { transcript = null; renderTranscript(); return; }
  transcript = await api(`/api/sessions/${sessionId}/transcript`);
  renderTranscript();
}

async function refreshAll() {
  if (refreshing) { refreshQueued = true; return; }
  refreshing = true;
  try {
    state = await api("/api/state");
    if (!selectedDevice || !deviceById(selectedDevice)) {
      selectedDevice = state.devices.some(d => d.device_id === state.local_device)
        ? state.local_device : (state.devices[0] && state.devices[0].device_id);
    }
    renderAgents(); renderRuns(); renderHeader();
    await ensureSession(selectedDevice);
    await loadTranscript();
  } catch (e) {
    $("hint").textContent = e.message;
  } finally {
    refreshing = false;
    if (refreshQueued) { refreshQueued = false; refreshAll(); }
  }
}

function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refreshAll, 220);
}

async function selectDevice(deviceId) {
  selectedDevice = deviceId;
  sessionId = null;
  renderAgents(); renderHeader();
  await ensureSession(deviceId);
  await loadTranscript();
}

$("send").onclick = async () => {
  const prompt = $("prompt").value.trim();
  if (!prompt || !selectedDevice) return;
  $("send").disabled = true;
  $("hint").textContent = "sending…";
  try {
    await ensureSession(selectedDevice);
    await api(`/api/sessions/${sessionId}/runs`, {
      method: "POST",
      body: JSON.stringify({ prompt, request_id: crypto.randomUUID() })
    });
    $("prompt").value = "";
    $("hint").textContent = "";
    await refreshAll();
    $("transcript").scrollTop = $("transcript").scrollHeight;
  } catch (e) {
    $("hint").textContent = e.message.includes("409") ? "Agent is busy; cancel or wait." : e.message;
  } finally {
    $("send").disabled = false;
  }
};

$("cancel").onclick = async () => {
  if (!activeRun) return;
  try { await api(`/api/runs/${activeRun.run_id}/cancel`, { method: "POST" }); await refreshAll(); }
  catch (e) { $("hint").textContent = e.message; }
};

$("new-chat").onclick = async () => {
  if (!selectedDevice) return;
  const d = deviceById(selectedDevice);
  const workspace = (d && d.capabilities && d.capabilities.workspace) || ".";
  const s = await api("/api/sessions", {
    method: "POST", body: JSON.stringify({ device_id: selectedDevice, workspace })
  });
  state.sessions.push(s);
  sessionByDevice[selectedDevice] = s.session_id;
  sessionId = s.session_id;
  transcript = null;
  await loadTranscript();
  $("hint").textContent = "new chat";
};

document.addEventListener("click", async (e) => {
  const agent = e.target.closest("[data-device].agent");
  if (agent) { await selectDevice(agent.dataset.device); return; }
  const run = e.target.closest("[data-run]");
  if (run) {
    selectedDevice = run.dataset.device;
    sessionByDevice[selectedDevice] = run.dataset.session;
    sessionId = run.dataset.session;
    renderAgents(); renderHeader();
    await loadTranscript();
  }
});

$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); }
});

const es = new EventSource("/api/events");
es.onopen = () => { $("conn").textContent = "live"; $("conn").className = "ok"; };
es.onerror = () => { $("conn").textContent = "reconnecting…"; $("conn").className = "bad"; };
es.onmessage = (e) => {
  try { const msg = JSON.parse(e.data); if (msg.kind !== "hello") scheduleRefresh(); } catch (_) {}
};

refreshAll();
setInterval(() => { if (document.visibilityState === "visible") refreshAll(); }, 5000);
</script>
</body>
</html>
